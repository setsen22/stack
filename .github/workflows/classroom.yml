
name: Autograding

on:
  push:
    paths-ignore:
      - '.github/badges/points.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run autograding tests
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import subprocess

          with open(".github/classroom/autograding.json",
                    encoding="utf-8") as f:
              config = json.load(f)

          tests = config.get("tests", [])
          score = 0
          total = sum(int(t.get("points", 0)) for t in tests)

          for test in tests:
              name = test.get("name", "Unnamed test")
              points = int(test.get("points", 0))
              setup = test.get("setup", "")
              command = test.get("run", "")
              test_input = test.get("input", "")
              expected = test.get("output", "")
              timeout = int(test.get("timeout", 1))

              print(f"\n--- {name} ({points} points) ---",
                    flush=True)

              try:
                  if setup:
                      result = subprocess.run(
                          setup,
                          shell=True,
                          executable="/bin/bash",
                          text=True,
                          capture_output=True,
                          timeout=max(timeout, 10)
                      )

                      if result.returncode != 0:
                          print("FAIL: setup/compile error")
                          print(result.stdout[:2000])
                          print(result.stderr[:2000])
                          continue

                  result = subprocess.run(
                      command,
                      shell=True,
                      executable="/bin/bash",
                      input=test_input,
                      text=True,
                      capture_output=True,
                      timeout=timeout
                  )

                  actual = result.stdout.replace(
                      "\r\n", "\n"
                  ).strip()

                  wanted = expected.replace(
                      "\r\n", "\n"
                  ).strip()

                  if result.returncode == 0 and actual == wanted:
                      score += points
                      print(f"PASS +{points}")
                  else:
                      print("FAIL")
                      print("Exit code:", result.returncode)
                      print("Expected:", repr(wanted[:500]))
                      print("Actual:", repr(actual[:500]))
                      print("stderr:", result.stderr[:2000])

              except subprocess.TimeoutExpired:
                  print("FAIL: timeout")
              except Exception as e:
                  print("FAIL:", e)

          print(f"\nSCORE: {score}/{total}", flush=True)

          with open("autograding-score.txt", "w") as f:
              f.write(f"{score}/{total}")

          with open("autograding-result.txt", "w") as f:
              f.write("pass" if score == total else "fail")
          PY

      - name: Create points badge
        shell: bash
        run: |
          mkdir -p .github/badges

          python3 <<'PY'
          from html import escape

          score = open("autograding-score.txt").read().strip()

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="108" height="20">
            <rect width="108" height="20" rx="3" fill="#555"/>
            <rect x="54" width="54" height="20" fill="#00a6b2"/>
            <g fill="#fff" text-anchor="middle"
               font-family="Verdana,DejaVu Sans,sans-serif"
               font-size="11">
              <text x="27" y="14">Points</text>
              <text x="81" y="14">{escape(score)}</text>
            </g>
          </svg>'''

          with open(".github/badges/points.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit points badge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/badges/points.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update points badge"
            git push
          fi

      - name: Check final result
        shell: bash
        run: |
          if [ "$(cat autograding-result.txt)" != "pass" ]; then
            echo "Autograding failed"
            exit 1
          fi

          echo "All tests passed"
